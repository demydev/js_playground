<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login_window</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="section">
        <div class="container">
            <div class="nav_bar">

            </div>
            <div class="hero_wrap">
                <div class="login_wrap">
                    <div class="log_left">
                        <span class="main_title">Login Window</span>

                        <div class="input_wrap">
                            <input type="text" class="input" id="first_name" placeholder="First Name">
                            <input type="text" class="input" id="second_name" placeholder="Second Name">
                        </div>

                        <input type="text" class="input" id="email" placeholder="Email">

                        <button class="send_btn" id="send_btn">Send</button>
                    </div>

                    <div class="log_right">
                        <img src="img/logo_bg.png" alt="">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
