<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>front_1</title>
    <!-- Connecting the CSS file -->
     <link rel="icon" href="img/cat-1.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script src="script.js" defer></script>

    <!-- The Container/Box for our card -->
    <div class="profile-card">
        
        <!-- Profile Image Placeholder -->
        <img src="img/cat-1.png" alt="profile-img" class="profile-pic">
        
        <!-- Text Content -->
        <h2 class="profile-name">Alex Morgan</h2>
        <p class="profile-title">Web Developer & Designer</p>
        <p class="profile-bio">Learning how to build beautiful, responsive layouts using HTML and CSS from scratch.</p>
        
        <div class="counter-box">
            <button class="counter-btn" id="increment-btn">Click!</button>
            <p id="counter-display">0</p>
            <button class="counter-btn_cancel" id="cancel-counter">Cancel</button>
        </div>
    </div>

</body>
</html>
